[project]
name = "nemo-3-5-transcribe"
version = "0.1.0"
description = "Build per-speaker and interaction-tagged transcription datasets with NVIDIA Nemotron 3.5 Transcribe"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "soundfile>=0.14.0",
]

[project.scripts]
nemo-3-5-transcribe = "nemo_3_5_transcribe:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "E", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-local-folder = ["helpers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
